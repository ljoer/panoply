# Modified for Panoply: generated secrets, overridable Catana image defaults,
# and no published database ports.
services:
  app-db:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_USER: bloodhound
      POSTGRES_DB: bloodhound
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing generated database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U bloodhound -d bloodhound -h 127.0.0.1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  graph-db:
    image: ${NEO4J_IMAGE:-neo4j:4.4}
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Missing generated graph password}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:7474 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  bloodhound:
    image: ${BLOODHOUND_IMAGE:-specterops/bloodhound:latest}
    environment:
      bhe_database_connection: user=bloodhound password=${POSTGRES_PASSWORD} dbname=bloodhound host=app-db
      bhe_neo4j_connection: neo4j://neo4j:${NEO4J_PASSWORD}@graph-db:7687/
    ports:
      - 127.0.0.1:${BLOODHOUND_PORT:-8080}:8080
    depends_on:
      app-db:
        condition: service_healthy
      graph-db:
        condition: service_healthy
volumes:
  postgres-data:
  neo4j-data:
